<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOYUUM 韓國 私密社團開團 🇰🇷</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF6F1;
    --warm-white: #FFFDF9;
    --blush: #E8C4B8;
    --dusty-rose: #C9897A;
    --terracotta: #A85C4A;
    --dark: #2A1F1A;
    --mid: #6B4F44;
    --light-text: #9A7B72;
    --border: #E2D0C8;
    --tag-bg: #F5EAE5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Serif TC', serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--dark);
    color: var(--cream);
    padding: 36px 24px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 18px,
      rgba(232,196,184,.07) 18px,
      rgba(232,196,184,.07) 19px
    );
  }
  .header-badge {
    display: inline-block;
    background: var(--terracotta);
    color: #fff;
    font-size: 11px;
    letter-spacing: .15em;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 14px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
  }
  header h1 {
    font-size: clamp(22px, 5vw, 34px);
    font-weight: 700;
    letter-spacing: .04em;
    line-height: 1.3;
    position: relative;
  }
  header p {
    margin-top: 10px;
    font-size: 13px;
    color: var(--blush);
    position: relative;
    letter-spacing: .03em;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--warm-white);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--light-text);
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    padding: 9px 12px 9px 36px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Noto Serif TC', serif;
    background: var(--cream);
    outline: none;
    transition: border-color .2s;
  }
  #searchInput:focus { border-color: var(--dusty-rose); }

  .cat-filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .cat-btn {
    padding: 6px 13px;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    font-size: 12px;
    font-family: 'Noto Serif TC', serif;
    cursor: pointer;
    background: var(--cream);
    color: var(--mid);
    transition: all .18s;
    white-space: nowrap;
  }
  .cat-btn:hover { border-color: var(--dusty-rose); color: var(--dusty-rose); }
  .cat-btn.active {
    background: var(--terracotta);
    border-color: var(--terracotta);
    color: #fff;
  }

  /* ── CART FLOAT ── */
  #cartBtn {
    position: fixed;
    bottom: 22px;
    right: 22px;
    z-index: 200;
    background: var(--terracotta);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px 22px;
    font-size: 14px;
    font-family: 'Noto Serif TC', serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(168,92,74,.4);
    transition: transform .2s, box-shadow .2s;
  }
  #cartBtn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(168,92,74,.5); }
  #cartCount {
    background: #fff;
    color: var(--terracotta);
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
  }

  /* ── PRODUCT LIST ── */
  .main-wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 16px 120px;
  }

  .cat-section { margin-bottom: 10px; }
  .cat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 0 10px;
    border-bottom: 2px solid var(--terracotta);
    margin-bottom: 6px;
  }
  .cat-icon { font-size: 18px; }
  .cat-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--terracotta);
    letter-spacing: .06em;
  }
  .cat-count {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--light-text);
    background: var(--tag-bg);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .product-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-bottom: 1px solid var(--border);
    transition: background .15s;
    border-radius: 4px;
  }
  .product-row:hover { background: var(--tag-bg); }

  .row-no {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--light-text);
    width: 28px;
    text-align: right;
    flex-shrink: 0;
  }
  .row-name {
    flex: 1;
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--dark);
  }
  .row-link {
    font-size: 11px;
    color: var(--dusty-rose);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 8px;
    border: 1px solid var(--blush);
    border-radius: 4px;
    white-space: nowrap;
    transition: all .15s;
    flex-shrink: 0;
  }
  .row-link:hover { background: var(--dusty-rose); color: #fff; border-color: var(--dusty-rose); }
  .row-price {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--terracotta);
    white-space: nowrap;
    width: 66px;
    text-align: right;
    flex-shrink: 0;
  }
  .row-add {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--dusty-rose);
    background: transparent;
    color: var(--dusty-rose);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
    line-height: 1;
  }
  .row-add:hover { background: var(--dusty-rose); color: #fff; }
  .row-add.in-cart {
    background: var(--terracotta);
    border-color: var(--terracotta);
    color: #fff;
    font-size: 14px;
  }

  /* ── CART MODAL ── */
  #cartOverlay {
    position: fixed;
    inset: 0;
    background: rgba(42,31,26,.5);
    z-index: 300;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  #cartOverlay.open { display: flex; }
  #cartModal {
    background: var(--warm-white);
    width: 100%;
    max-width: 680px;
    max-height: 80vh;
    border-radius: 20px 20px 0 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 -8px 40px rgba(0,0,0,.2);
  }
  .cart-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cart-header h2 { font-size: 16px; color: var(--dark); }
  #closeCart {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: var(--mid);
    line-height: 1;
  }
  .cart-body { overflow-y: auto; flex: 1; padding: 4px 0; }
  .cart-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--light-text);
    font-size: 14px;
  }
  .cart-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--border);
  }
  .cart-item-name { flex: 1; font-size: 13px; line-height: 1.4; }
  .cart-qty-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .qty-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: none;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--mid);
    transition: border-color .15s;
    line-height: 1;
  }
  .qty-btn:hover { border-color: var(--dusty-rose); color: var(--dusty-rose); }
  .qty-num {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    min-width: 20px;
    text-align: center;
  }
  .cart-item-price {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--terracotta);
    white-space: nowrap;
    min-width: 60px;
    text-align: right;
  }
  .cart-del {
    background: none;
    border: none;
    color: #ccc;
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    transition: color .15s;
  }
  .cart-del:hover { color: var(--dusty-rose); }

  .cart-footer {
    padding: 14px 20px 20px;
    border-top: 1px solid var(--border);
    background: var(--warm-white);
  }
  .cart-total {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .cart-total span:last-child {
    font-family: 'DM Mono', monospace;
    color: var(--terracotta);
  }
  #copyOrderBtn {
    width: 100%;
    background: var(--terracotta);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 14px;
    font-family: 'Noto Serif TC', serif;
    cursor: pointer;
    letter-spacing: .04em;
    transition: background .2s;
  }
  #copyOrderBtn:hover { background: var(--dark); }

  /* ── ORDER TEXT MODAL ── */
  #orderOverlay {
    position: fixed;
    inset: 0;
    background: rgba(42,31,26,.6);
    z-index: 400;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #orderOverlay.open { display: flex; }
  #orderModal {
    background: var(--warm-white);
    width: 100%;
    max-width: 560px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 48px rgba(0,0,0,.25);
  }
  .order-header {
    padding: 16px 20px;
    background: var(--dark);
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
  }
  #closeOrder { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  #orderText {
    width: 100%;
    height: 260px;
    padding: 16px;
    border: none;
    background: #FAF6F1;
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    color: var(--dark);
    resize: none;
    outline: none;
    line-height: 1.7;
  }
  .order-actions {
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--border);
  }
  .btn-copy, .btn-close2 {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    font-size: 13px;
    font-family: 'Noto Serif TC', serif;
    cursor: pointer;
    border: 1.5px solid var(--terracotta);
    transition: all .2s;
  }
  .btn-copy { background: var(--terracotta); color: #fff; }
  .btn-copy:hover { background: var(--dark); border-color: var(--dark); }
  .btn-close2 { background: transparent; color: var(--terracotta); }
  .btn-close2:hover { background: var(--tag-bg); }

  .no-results {
    text-align: center;
    padding: 48px 20px;
    color: var(--light-text);
    font-size: 14px;
  }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 88px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--dark);
    color: #fff;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    white-space: nowrap;
    z-index: 500;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 500px) {
    .row-link { display: none; }
    .product-row { gap: 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-badge">🇰🇷 MOYUUM × 私密社團</div>
  <h1>韓國精品育兒好物<br>限時開團</h1>
  <p>共 221 項商品 · 點擊「+」加入清單 · 最後複製訂單傳給團主</p>
</header>

<div class="toolbar">

    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="搜尋商品名稱…">
  </div>
  <div class="cat-filters" id="catFilters"></div>
</div>

<div class="main-wrap" id="mainWrap"></div>

<button id="cartBtn">
  🛍 我的清單
  <span id="cartCount">0</span>
</button>

<!-- Cart Modal -->
<div id="cartOverlay">
  <div id="cartModal">
    <div class="cart-header">
      <h2>📋 訂購清單</h2>
      <button id="closeCart">×</button>
    </div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>合計金額</span>
        <span id="cartTotalAmt">NT$0</span>
      </div>
      <button id="copyOrderBtn">✉ 產生訂單文字</button>
    </div>
  </div>
</div>

<!-- Order Text Modal -->
<div id="orderOverlay">
  <div id="orderModal">
    <div class="order-header">
      <span>📋 訂單內容</span>
      <button id="closeOrder">×</button>
    </div>
    <textarea id="orderText" readonly></textarea>
    <div class="order-actions">
      <button class="btn-copy" id="doCopy">複製訂單</button>
      <button class="btn-close2" id="closeOrder2">關閉</button>
    </div>
  </div>
</div>

<div id="toast"></div>

const CAT_ICONS = {'馬年新生兒限定禮盒':'🎁','餐具系列':'🍽','清潔系列':'🧼','奶嘴系列':'😊','固齒器系列':'🦷','奶瓶系列':'🍼','水杯系列':'🥤'};
const CATEGORIES = [...new Set(PRODUCTS.map(p => p.cat))];

let cart = {}; // key: no, value: qty
let activeCat = 'all';
let searchQ = '';

// Build category filter buttons
const filtersEl = document.getElementById('catFilters');
const allBtn = document.createElement('button');
allBtn.className = 'cat-btn active';
allBtn.textContent = '全部';
allBtn.dataset.cat = 'all';
filtersEl.appendChild(allBtn);
CATEGORIES.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn';
  btn.textContent = (CAT_ICONS[cat]||'') + ' ' + cat;
  btn.dataset.cat = cat;
  filtersEl.appendChild(btn);
});

filtersEl.addEventListener('click', e => {
  const btn = e.target.closest('.cat-btn');
  if (!btn) return;
  activeCat = btn.dataset.cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value.trim();
  render();
});

function render() {
  const wrap = document.getElementById('mainWrap');
  const filtered = PRODUCTS.filter(p => {
    const catOk = activeCat === 'all' || p.cat === activeCat;
    const searchOk = !searchQ || p.name.includes(searchQ);
    return catOk && searchOk;
  });

  if (!filtered.length) {
    wrap.innerHTML = '<div class="no-results">🔍 找不到符合的商品</div>';
    return;
  }

  // Group by category
  const groups = {};
  filtered.forEach(p => { (groups[p.cat] = groups[p.cat]||[]).push(p); });

  wrap.innerHTML = Object.entries(groups).map(([cat, items]) => `
    <div class="cat-section">
      <div class="cat-header">
        <span class="cat-icon">${CAT_ICONS[cat]||'📦'}</span>
        <span class="cat-title">${cat}</span>
        <span class="cat-count">${items.length} 項</span>
      </div>
      ${items.map(p => `
        <div class="product-row" id="row-${p.no}">
          <span class="row-no">${p.no}</span>
          <span class="row-name">${p.name}</span>
          <a class="row-link" href="${p.url}" target="_blank" rel="noopener">🔗 查看</a>
          <span class="row-price">NT$${p.price.toLocaleString()}</span>
          <button class="row-add ${cart[p.no] ? 'in-cart' : ''}" data-no="${p.no}" title="加入清單">
            ${cart[p.no] ? '✓' : '+'}
          </button>
        </div>
      `).join('')}
    </div>
  `).join('');

  // Bind add buttons
  wrap.querySelectorAll('.row-add').forEach(btn => {
    btn.addEventListener('click', () => {
      const no = +btn.dataset.no;
      if (cart[no]) {
        delete cart[no];
      } else {
        cart[no] = 1;
      }
      updateCartCount();
      // Update just this button
      const inCart = !!cart[no];
      btn.classList.toggle('in-cart', inCart);
      btn.textContent = inCart ? '✓' : '+';
    });
  });
}

function updateCartCount() {
  const total = Object.values(cart).reduce((a,b) => a+b, 0);
  document.getElementById('cartCount').textContent = total;
}

// Cart modal
document.getElementById('cartBtn').addEventListener('click', openCart);
document.getElementById('closeCart').addEventListener('click', () => {
  document.getElementById('cartOverlay').classList.remove('open');
});
document.getElementById('cartOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});

function openCart() {
  renderCart();
  document.getElementById('cartOverlay').classList.add('open');
}

function renderCart() {
  const body = document.getElementById('cartBody');
  const keys = Object.keys(cart).map(Number).filter(n => cart[n] > 0);
  if (!keys.length) {
    body.innerHTML = '<div class="cart-empty">清單是空的，快去挑選商品吧！</div>';
    document.getElementById('cartTotalAmt').textContent = 'NT$0';
    return;
  }
  let total = 0;
  body.innerHTML = keys.map(no => {
    const p = PRODUCTS.find(x => x.no === no);
    const subtotal = p.price * cart[no];
    total += subtotal;
    return `
      <div class="cart-item">
        <span class="cart-item-name">${p.name}</span>
        <div class="cart-qty-wrap">
          <button class="qty-btn" data-no="${no}" data-action="minus">−</button>
          <span class="qty-num">${cart[no]}</span>
          <button class="qty-btn" data-no="${no}" data-action="plus">+</button>
        </div>
        <span class="cart-item-price">NT$${subtotal.toLocaleString()}</span>
        <button class="cart-del" data-no="${no}">✕</button>
      </div>
    `;
  }).join('');
  document.getElementById('cartTotalAmt').textContent = 'NT$' + total.toLocaleString();

  body.querySelectorAll('.qty-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const no = +btn.dataset.no;
      if (btn.dataset.action === 'plus') cart[no]++;
      else { cart[no]--; if (cart[no] <= 0) delete cart[no]; }
      updateCartCount();
      renderCart();
      render(); // refresh add buttons
    });
  });
  body.querySelectorAll('.cart-del').forEach(btn => {
    btn.addEventListener('click', () => {
      delete cart[+btn.dataset.no];
      updateCartCount();
      renderCart();
      render();
    });
  });
}

// Generate order text
document.getElementById('copyOrderBtn').addEventListener('click', () => {
  const keys = Object.keys(cart).map(Number).filter(n => cart[n] > 0);
  if (!keys.length) { showToast('請先加入商品'); return; }
  let lines = ['📦 MOYUUM 韓國 私密社團開團訂單\n'];
  let total = 0;
  keys.forEach(no => {
    const p = PRODUCTS.find(x => x.no === no);
    const sub = p.price * cart[no];
    total += sub;
    lines.push(`${p.name}\n  × ${cart[no]} 件  NT$${p.price} = NT$${sub.toLocaleString()}`);
  });
  lines.push(`\n合計：NT$${total.toLocaleString()}`);
  document.getElementById('orderText').value = lines.join('\n');
  document.getElementById('cartOverlay').classList.remove('open');
  document.getElementById('orderOverlay').classList.add('open');
});

document.getElementById('closeOrder').addEventListener('click', () => document.getElementById('orderOverlay').classList.remove('open'));
document.getElementById('closeOrder2').addEventListener('click', () => document.getElementById('orderOverlay').classList.remove('open'));
document.getElementById('orderOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});
document.getElementById('doCopy').addEventListener('click', () => {
  const text = document.getElementById('orderText').value;
  navigator.clipboard.writeText(text).then(() => showToast('✅ 已複製，貼給團主吧！')).catch(() => {
    document.getElementById('orderText').select();
    document.execCommand('copy');
    showToast('✅ 已複製！');
  });
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

render();
</script>

</html>
